[package]
name = "pytja_server"
version = "0.1.0"
edition = "2021"
default-run = "pytja_server"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = "0.10"
prost = "0.12"
colored = "2.0"

# Unsere eigenen Module
pytja_proto = { path = "../pytja_proto" }
pytja_core = { path = "../pytja_core" }

# Utilities
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tokio-stream = "0.1"
jsonwebtoken = "9.2" # Oder deine Version
serde = { version = "1.0", features = ["derive"] } # <-- FEHLTE
serde_json = "1.0"
tracing = "0.1"
dashmap = "5.5" # Oder 6.0
bytes = "1.5" # <-- FEHLTE

redis = { version = "0.24", features = ["tokio-comp", "json"] }
clap = { version = "4.4", features = ["derive"] }